name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish the .exe as the "latest" release

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pytest pyinstaller==6.11.1

      - name: Test
        run: python -m pytest -q

      - name: Build ManheimPrediction.exe
        run: >
          pyinstaller --onefile --windowed --name ManheimPrediction
          --paths src --add-data "criteria.toml;."
          --collect-all pdfplumber --collect-all pdfminer
          app_main.py

      - name: Smoke test the .exe imports
        shell: bash
        run: ls -la dist/ && test -s dist/ManheimPrediction.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ManheimPrediction-exe
          path: dist/ManheimPrediction.exe

      - name: Publish as the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/ManheimPrediction.exe \
            --title "Manheim Prediction (latest)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download ManheimPrediction.exe below and double-click it."
