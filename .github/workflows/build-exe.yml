name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish the .exe as the "latest" release

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pytest "pyinstaller>=6.16" "pyinstaller-hooks-contrib>=2025.8"

      - name: Test
        run: python -m pytest -q

      - name: Build ManheimPrediction.exe
        run: >
          pyinstaller --onefile --windowed --name ManheimPrediction
          --paths src --add-data "criteria.toml;."
          --collect-all pdfplumber --collect-all pdfminer
          --collect-all numpy --collect-submodules pandas --collect-data pandas
          app_main.py

      - name: Self-test the finished .exe (it must really start)
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath "dist\ManheimPrediction.exe" -ArgumentList "--selftest", "`"$result`"" -Wait -PassThru
          if (Test-Path $result) { Get-Content $result } else { Write-Output "no result file" }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $result) -or (Get-Content $result -Raw).Trim() -ne "OK") {
            Write-Error "Self-test failed (exit code $($p.ExitCode))"; exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ManheimPrediction-exe
          path: dist/ManheimPrediction.exe

      - name: Publish as the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/ManheimPrediction.exe \
            --title "Manheim Prediction (latest)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download ManheimPrediction.exe below and double-click it."
